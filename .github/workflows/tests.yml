name: Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    test:
        name: Unit & functional tests (py${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12"]


        steps:
            - name: Check out repositiry
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
                cache: "pip"

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e . -r requirements.txt


            - name: Run test (excluding integration)
              working-directory: source
              run: |
                pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml -v

            - name: Upload coverage report
              if: matrix.python-version == '3.12'
              uses: actions/upload-artifact@v4
              with:
                name: coverage-report
                path: source/coverage.xml

    integration:
        name: Integration tests (real sockets)
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: check out repositiory
              uses: actions/checkout@v4


            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: "pip"
                
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e . -r requirements.txt

            - name: Run tests
              run: |
                pytest -m integration -v
                
